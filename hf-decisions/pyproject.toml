[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-decisions"
version = "0.1.0"
description = "Registers pipeline('typed-decision') with HuggingFace transformers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "laya-hf contributors" }]
keywords = ["typed-decision", "huggingface", "transformers", "pipeline", "jev", "laya"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "transformers>=4.45",
    "hf-decisions-schema>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "numpy"]

[project.urls]
Homepage = "https://github.com/hf-decisions/laya-hf"
Repository = "https://github.com/hf-decisions/laya-hf"
Issues = "https://github.com/hf-decisions/laya-hf/issues"

[tool.setuptools]
packages = ["hf_decisions"]

[tool.setuptools.package-dir]
hf_decisions = "."

[tool.setuptools.package-data]
hf_decisions = ["py.typed"]
