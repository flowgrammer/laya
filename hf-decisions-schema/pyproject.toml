[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-decisions-schema"
version = "0.1.0"
description = "Wire-format schema for typed-decision models (choice / score / noul)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "laya-hf contributors" }]
keywords = ["typed-decision", "schema", "pydantic", "jev", "laya", "rlcd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    # Pydantic evaluates annotations at runtime; on py3.9 PEP 604 unions (`X | Y`) raise
    # TypeError. eval_type_backport lets py3.9 parse the same annotations py3.10+ handles natively.
    "eval_type_backport>=0.2.0; python_version < '3.10'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/hf-decisions/laya-hf"
Repository = "https://github.com/hf-decisions/laya-hf"
Issues = "https://github.com/hf-decisions/laya-hf/issues"

[tool.setuptools]
packages = ["hf_decisions_schema"]

[tool.setuptools.package-dir]
hf_decisions_schema = "."

[tool.setuptools.package-data]
hf_decisions_schema = ["py.typed"]
