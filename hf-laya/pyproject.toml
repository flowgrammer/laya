[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-laya"
version = "0.1.0"
description = "HF-shaped Laya typed-decision models (configuration, modeling, processing)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "laya-hf contributors" }]
keywords = ["laya", "rlcd", "typed-decision", "modernbert", "mmbert", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.45",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
"hf-laya-publish" = "hf_laya.convert_laya_to_hf:main"

[project.urls]
Homepage = "https://github.com/hf-decisions/laya-hf"
Repository = "https://github.com/hf-decisions/laya-hf"
Issues = "https://github.com/hf-decisions/laya-hf/issues"

[tool.setuptools]
packages = ["hf_laya"]

[tool.setuptools.package-dir]
hf_laya = "."

[tool.setuptools.package-data]
hf_laya = ["py.typed", "configs/*.json"]
