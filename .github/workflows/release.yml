name: release

# Tag `schema-vX.Y.Z`, `shim-vX.Y.Z`, or `laya-vX.Y.Z` to build, verify the version matches
# the tag, publish the corresponding package to PyPI, and open a GitHub Release.
#
# Set up once per package on PyPI -> Publishing -> Trusted Publisher for
#   owner flowgrammer, repo laya, workflow release.yml, environment pypi
# Then no API token ever lives in GitHub secrets.

on:
  push:
    tags:
      - "schema-v*"
      - "shim-v*"
      - "laya-v*"

permissions:
  contents: write        # create the GitHub Release
  id-token: write        # PyPI trusted publishing

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.pick.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pick package from tag
        id: pick
        run: |
          case "${GITHUB_REF_NAME}" in
            schema-v*) echo "dir=hf-decisions-schema" >> "$GITHUB_OUTPUT" ;;
            shim-v*)   echo "dir=hf-decisions"        >> "$GITHUB_OUTPUT" ;;
            laya-v*)   echo "dir=hf-laya"             >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown release tag: $GITHUB_REF_NAME" && exit 1 ;;
          esac

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build ${{ steps.pick.outputs.dir }}

      - name: Version matches the tag
        run: |
          pkg=$(python -c "import re,sys;print(re.search(r'version = \"(.*)\"', open(sys.argv[1]).read()).group(1))" \
                "${{ steps.pick.outputs.dir }}/pyproject.toml")
          tag="${GITHUB_REF_NAME#*-v}"
          echo "pyproject=$pkg tag=$tag"
          test "$pkg" = "$tag" || { echo "::error::pyproject version $pkg does not match tag $tag"; exit 1; }

      - name: Verify sdist and wheel both built
        run: |
          ls ${{ steps.pick.outputs.dir }}/dist/*.whl >/dev/null
          ls ${{ steps.pick.outputs.dir }}/dist/*.tar.gz >/dev/null

      - name: twine check
        run: python -m twine check ${{ steps.pick.outputs.dir }}/dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.pick.outputs.dir }}
          path: ${{ steps.pick.outputs.dir }}/dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.dir }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github_release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.dir }}
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - uploading artifacts to it"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
