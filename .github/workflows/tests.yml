name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # transformers probes for TensorFlow at import; when TF is present its abseil runtime can
  # deadlock model construction. Laya is torch-only.
  USE_TF: "0"
  USE_TORCH: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            -e "./hf-decisions-schema[test]" \
            -e "./hf-decisions[test]" \
            -e "./hf-laya[test]"
      - name: Byte-compile every module
        run: python -m compileall -q hf-decisions-schema/hf_decisions_schema hf-decisions/hf_decisions hf-laya/hf_laya
      - name: pytest
        run: python -m pytest hf-decisions-schema/tests hf-decisions/tests hf-laya/tests -v
